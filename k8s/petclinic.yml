apiVersion: v1
kind: Namespace
metadata:
  name: uatnamespace
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: uatnamespace
spec:
  type: NodePort
  selector:
    app: petclinic
  ports:
    - name: http
      port: 90           # service port
      targetPort: 7845   # container port
      nodePort: 30002    # explicit NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: uatnamespace
  labels:
    app: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
        - name: petclinic
          image: nirmal46789/java-application:uat-7
          ports:
            - name: http
              containerPort: 7845
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://demo-db:5432/petclinic
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-db
                  key: password
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 45
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
